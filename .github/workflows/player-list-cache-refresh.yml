name: Refresh prop center and projection player-list caches

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-list-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check private source repository token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: test -n "$PRIVATE_REPO_TOKEN" || { echo 'Add repository secret PRIVATE_REPO_TOKEN'; exit 1; }

      - name: Check out player-list fetcher source
        uses: actions/checkout@v6
        with:
          repository: jdnhunter99-sys/sports-edge-ai2
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts/refresh_player_lists_github.py
          path: source

      - name: Check out published cache branch
        uses: actions/checkout@v6
        with:
          repository: jdnhunter99-sys/sports-edge-ai2
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: data

      - name: Prepare cache branch
        working-directory: data
        run: |
          git fetch origin refs/heads/player-lists-data:refs/remotes/origin/player-lists-data 2>/dev/null \
            && git checkout -B player-lists-data origin/player-lists-data \
            || { git checkout --orphan player-lists-data; git rm -rf .; }

      - name: Fetch and build per-screen JSON caches directly from source
        env:
          PLAYER_LISTS_OUTPUT_DIR: ${{ github.workspace }}/data/player-lists
        run: python3 source/scripts/refresh_player_lists_github.py

      - name: Publish completed JSON cache files
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player-lists
          if git diff --cached --quiet; then echo 'Player-list cache unchanged'; exit 0; fi
          git commit -qm 'Refresh prop center and projection player-list caches'
          git push --quiet origin HEAD:player-lists-data
