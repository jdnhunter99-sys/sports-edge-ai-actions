name: Refresh prop center and projection player-list caches

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: player-list-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Check out the published player-list branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: player-lists-data
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: data

      - name: Configure data commit identity
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch and build per-screen JSON caches directly from source
        env:
          PLAYER_LISTS_OUTPUT_DIR: ${{ github.workspace }}/data/player-lists
        run: python3 action/scripts/refresh_player_lists_github.py

      - name: Publish completed JSON cache files
        working-directory: data
        run: |
          git add player-lists
          if git diff --cached --quiet; then echo 'Player-list cache unchanged'; exit 0; fi
          git commit -qm 'Refresh prop center and projection player-list caches'
          git push --quiet origin HEAD:player-lists-data
