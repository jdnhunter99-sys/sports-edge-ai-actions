name: Line Movement Graphs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: propline-private-data-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Sparse check out the published graph files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data
          cd data
          git init
          git remote add origin "https://github.com/${DATA_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --quiet --depth=1 --filter=blob:none origin refs/heads/propline-data
          git checkout --quiet --detach --no-checkout FETCH_HEAD
          git sparse-checkout init --cone
          git sparse-checkout set line-movement-graphs/v1

      - name: Configure data commit identity
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Scrape and publish ScoresAndOdds line movement graphs
        env:
          LINE_MOVEMENT_OUTPUT_DIR: ${{ github.workspace }}/data/line-movement-graphs/v1
        run: deno run --no-check --allow-net --allow-read --allow-write --allow-env=LINE_MOVEMENT_OUTPUT_DIR action/action/scripts/publish_line_movement_graphs.ts

      - name: Publish updated per-game graph files
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add line-movement-graphs/v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'Publish ScoresAndOdds line movement graphs'
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" push --quiet origin HEAD:propline-data
