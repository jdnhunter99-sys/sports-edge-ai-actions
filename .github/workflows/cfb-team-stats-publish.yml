name: Refresh CFB team stats cache

on:
  workflow_dispatch:
    inputs:
      refresh_previous:
        description: Rebuild the previous season's materialized stats
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cfb-team-stats-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate required secrets
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          test -n "$CFBD_API_KEY" || { echo 'Add repository secret CFBD_API_KEY'; exit 1; }
          test -n "$PRIVATE_REPO_TOKEN" || { echo 'Add repository secret PRIVATE_REPO_TOKEN'; exit 1; }

      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify standalone CFB publisher checkout
        run: |
          test -f action/scripts/refresh_cfb_team_stats_github.ts || { echo 'CFB publisher script is missing from the Actions repository main branch'; find . -maxdepth 4 -type f -print; exit 1; }
          test -f action/scripts/build_cfb_prop_center_cache.py || { echo 'CFB prop-center cache builder is missing from the Actions repository main branch'; exit 1; }

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Read existing private data branch
        uses: actions/checkout@v6
        with:
          repository: jdnhunter99-sys/sports-edge-ai2
          ref: cfb-team-stats-data
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: data

      - name: Configure private data commit identity
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch, calculate, and materialize all CFB timeframes
        env:
          CFB_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFB_REFRESH_PREVIOUS_SEASON: ${{ github.event.inputs.refresh_previous || 'false' }}
        run: |
          deno run --no-npm --allow-net --allow-env --allow-read --allow-write action/scripts/refresh_cfb_team_stats_github.ts

      - name: Build compact prop-center opponent and player-log caches
        env:
          CFB_STATS_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python3 action/scripts/build_cfb_prop_center_cache.py

      - name: Publish CFB stats and prop-center caches
        working-directory: data
        run: |
          git add cfb-team-stats cfb-prop-center
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'Refresh CFB team stats cache'
          git push --quiet origin HEAD:cfb-team-stats-data
