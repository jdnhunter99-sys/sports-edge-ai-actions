name: NFL Injury Report Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-injury-report-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare the NFL injury data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_REPOSITORY: ${{ github.repository }}
          DATA_BRANCH: nfl-injury-report-data
        run: |
          set -euo pipefail
          mkdir -p data
          git -C data init -b "$DATA_BRANCH"
          git -C data config user.name 'github-actions[bot]'
          git -C data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C data remote add origin "https://github.com/$DATA_REPOSITORY.git"
          token_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          if git -C data -c http.extraheader="AUTHORIZATION: basic $token_auth" ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git -C data -c http.extraheader="AUTHORIZATION: basic $token_auth" fetch --quiet --depth=1 origin "$DATA_BRANCH"
            git -C data reset --hard FETCH_HEAD
          fi

      - name: Fetch Yahoo injuries and calculate player and team impact
        env:
          NFL_INJURY_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python action/action/scripts/publish_nfl_injury_report.py

      - name: Publish NFL injury report JSON
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_BRANCH: nfl-injury-report-data
        run: |
          set -euo pipefail
          git add nfl-injuries/latest.json
          if git diff --cached --quiet; then
            echo 'NFL injury report JSON is unchanged.'
            exit 0
          fi
          git commit -qm 'Refresh NFL injury report data'
          token_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic $token_auth" push --quiet origin "HEAD:$DATA_BRANCH"
