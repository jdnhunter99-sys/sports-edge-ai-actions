name: Publish PropLine game odds JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Check required API key
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: test -n "$PROPLINE_API_KEY" || { echo 'Add repository secret PROPLINE_API_KEY'; exit 1; }

      - name: Shallow sparse checkout of the published data branch
        env:
          DATA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --sparse --filter=tree:0 --depth=1 --no-tags \
            --single-branch --branch propline-data \
            "https://github.com/${DATA_REPOSITORY}.git" data
          git -C data sparse-checkout set --no-cone \
            /game-odds/nfl/index.json \
            /game-odds/cfb/index.json \
            /game-odds/nba/index.json \
            /game-odds/wnba/index.json \
            /game-odds/nhl/index.json \
            /game-odds/mlb/index.json \
            /game-odds/ncaab/index.json \
            /game-card-odds/v2/latest.json \
            /game-card-odds/v2/previous.json \
            '/NCAAB Dashboard/latest.json'

      - name: Fetch only event caches referenced by those indexes
        working-directory: data
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/propline-cached-event-paths"
          import json
          from pathlib import Path

          sports = ('nfl', 'cfb', 'nba', 'wnba', 'nhl', 'mlb', 'ncaab')
          paths = set()
          for sport in sports:
              index_path = Path('game-odds') / sport / 'index.json'
              try:
                  payload = json.loads(index_path.read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  continue
              for event in payload.get('events', []):
                  if not isinstance(event, dict):
                      continue
                  value = str(event.get('path') or '')
                  prefix = f'game-odds/{sport}/events/'
                  if value.startswith(prefix) and value.endswith('.json') and '..' not in Path(value).parts:
                      paths.add(value)
          for value in sorted(paths):
              print(value)
          PY
          mapfile -t cached_paths < "$RUNNER_TEMP/propline-cached-event-paths"
          if ((${#cached_paths[@]})); then
            # `sparse-checkout add` does not support --no-cone. Re-set the
            # non-cone pattern list and retain the index/fallback files needed
            # by later steps while adding the referenced event caches.
            git sparse-checkout set --no-cone \
              /game-odds/nfl/index.json \
              /game-odds/cfb/index.json \
              /game-odds/nba/index.json \
              /game-odds/wnba/index.json \
              /game-odds/nhl/index.json \
              /game-odds/mlb/index.json \
              /game-odds/ncaab/index.json \
              /game-card-odds/v2/latest.json \
              /game-card-odds/v2/previous.json \
              '/NCAAB Dashboard/latest.json' \
              "${cached_paths[@]}"
          fi

      - name: Configure data commit identity
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Prepare isolated output with the current odds history
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/propline-game-odds-output"
          mkdir -p "$output_dir"
          if [[ -d data/game-odds ]]; then
            cp -a data/game-odds "$output_dir/game-odds"
          fi

      - name: Build and validate a complete replacement
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_OUTPUT_DIR: ${{ runner.temp }}/propline-game-odds-output
        run: |
          set -euo pipefail
          python3 action/scripts/publish_propline_game_odds.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("${{ runner.temp }}/propline-game-odds-output/game-card-odds/v2/latest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("schema_version") != 2:
              raise SystemExit("Refusing to publish game-card odds with an unexpected schema")
          if not payload.get("generated_at") or not isinstance(payload.get("games"), list) or not payload["games"]:
              raise SystemExit("Refusing to replace published game-card odds with an empty or incomplete feed")
          print(f"Validated replacement game-card feed: {len(payload['games'])} games")

          ncaab_path = Path("${{ runner.temp }}/propline-game-odds-output/NCAAB Dashboard/latest.json")
          ncaab = json.loads(ncaab_path.read_text(encoding="utf-8"))
          if ncaab.get("schema_version") != 1 or ncaab.get("sport") != "ncaab":
              raise SystemExit("Refusing to publish NCAAB dashboard odds with an unexpected schema")
          if not ncaab.get("generated_at") or not isinstance(ncaab.get("games"), list):
              raise SystemExit("Refusing to publish an invalid NCAAB dashboard odds list")
          if any(game.get("sport") != "ncaab" or not game.get("books") for game in ncaab["games"]):
              raise SystemExit("NCAAB dashboard odds list contains a non-NCAAB or unpriced game")
          print(f"Validated NCAAB dashboard odds list: {len(ncaab['games'])} games")
          PY

      - name: Publish validated odds without removing the current file
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/propline-game-odds-output"
          test -s "$output_dir/game-card-odds/v2/latest.json"
          test -s "$output_dir/NCAAB Dashboard/latest.json"
          test -d "$output_dir/game-odds"

          # Keep the last published payload as a fallback for clients while
          # GitHub's raw-content edge propagates the newly published large file.
          if [[ -s game-card-odds/v2/latest.json ]]; then
            cp game-card-odds/v2/latest.json game-card-odds/v2/previous.json.tmp
            mv game-card-odds/v2/previous.json.tmp game-card-odds/v2/previous.json
          fi

          python3 - "$output_dir" <<'PY' > "$RUNNER_TEMP/propline-publish-paths"
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          paths = {str(path.relative_to(output)) for path in (output / 'game-odds').rglob('*') if path.is_file()}
          paths.update({'game-card-odds/v2/latest.json', 'NCAAB Dashboard/latest.json'})
          if Path('game-card-odds/v2/previous.json').is_file():
              paths.add('game-card-odds/v2/previous.json')
          for value in sorted(paths):
              print(value)
          PY
          mapfile -t publish_paths < "$RUNNER_TEMP/propline-publish-paths"
          git sparse-checkout set --no-cone "${publish_paths[@]}"

          mkdir -p game-odds game-card-odds/v2
          cp -a "$output_dir/game-odds/." game-odds/
          cp "$output_dir/game-card-odds/v2/latest.json" game-card-odds/v2/latest.json.tmp
          mv game-card-odds/v2/latest.json.tmp game-card-odds/v2/latest.json

          mkdir -p 'NCAAB Dashboard'
          cp "$output_dir/NCAAB Dashboard/latest.json" 'NCAAB Dashboard/latest.json.tmp'
          mv 'NCAAB Dashboard/latest.json.tmp' 'NCAAB Dashboard/latest.json'

          git add -- "${publish_paths[@]}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'Publish PropLine game odds and all-book main-line feed'
          bash ../action/scripts/push_data_branch.sh propline-data
