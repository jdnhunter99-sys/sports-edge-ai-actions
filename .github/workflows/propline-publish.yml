name: Publish private PropLine JSON

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: propline-private-data-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          path: action

      - name: Check required API key
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: test -n "$PROPLINE_API_KEY" || { echo 'Add repository secret PROPLINE_API_KEY'; exit 1; }

      - name: Sparse check out the published PropLine data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p data
          cd data
          git init
          git remote add origin "https://github.com/${DATA_REPOSITORY}.git"
          token_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${token_auth}" fetch \
            --depth=1 --filter=blob:none origin refs/heads/propline-data
          git checkout --detach --no-checkout FETCH_HEAD
          git sparse-checkout init --cone
          git sparse-checkout set 'Player Odds/cfb' team-rosters

      - name: Configure data commit identity
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch and build complete JSON generation
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          PROPLINE_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python3 action/scripts/publish_propline.py

      - name: Publish completed PropLine generation
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Replace only the generated PropLine trees. Keep unrelated data-branch
          # paths (for example game-odds) in the index without checking them out.
          token_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git rm --cached --sparse -r --ignore-unmatch -- \
            'Player Odds' 'Player Lists' versions player-lists
          git add --sparse -A -- 'Player Odds' 'Player Lists' manifest.json team-rosters
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'Publish complete PropLine JSON generation'
          git -c http.extraheader="AUTHORIZATION: basic ${token_auth}" \
            push --quiet origin HEAD:propline-data
