name: Refresh NCAAF SharpOdds cache

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sharp-odds-ncaaf-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required SharpOdds secrets
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
        run: test -n "$SHARP_API_KEY" || { echo 'Add repository secret SHARP_API_KEY'; exit 1; }

      - name: Check out this Actions repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check out the published SharpOdds data branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: sharpodds-data
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: data

      - name: Configure data commit identity
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Refresh and materialize NCAAF snapshots
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
          PINNACLE_GUEST_API_KEY: ${{ secrets.PINNACLE_GUEST_API_KEY }}
          NOVIG_CLIENT_ID: ${{ secrets.NOVIG_CLIENT_ID }}
          NOVIG_CLIENT_SECRET: ${{ secrets.NOVIG_CLIENT_SECRET }}
          REBET_API_KEY: ${{ secrets.REBET_API_KEY }}
          SHARP_ODDS_OUTPUT_DIR: ${{ github.workspace }}/data
          SHARP_ODDS_IMPORT_ONLY: 'true'
        run: deno run --node-modules-dir=auto --allow-net --allow-env --allow-read --allow-write action/scripts/refresh_sharp_odds_ncaaf_github.ts

      - name: Publish NCAAF cache generation
        working-directory: data
        run: |
          git add sharp-odds/ncaaf
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm 'Refresh NCAAF SharpOdds cache'
          git push --quiet origin HEAD:sharpodds-data
