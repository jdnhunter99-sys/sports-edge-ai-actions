name: Pikkit Consensus HTTP Publisher
on:
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Pikkit league codes, comma separated, or all'
        default: 'all'
        required: false
      days:
        description: 'Days to check, starting today (1-14)'
        default: '5'
        required: false
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: pikkit-consensus-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LEAGUES: ${{ inputs.leagues || 'all' }}
      DAYS_AHEAD: ${{ inputs.days || '5' }}
      EVENT_DELAY_MIN_SECONDS: '7'
      EVENT_DELAY_MAX_SECONDS: '15'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect consensus
        env:
          PIKKIT_AUTH_TOKEN: ${{ secrets.PIKKIT_AUTH_TOKEN }}
        run: python3 scripts/collect.py
      - name: Publish JSON feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh Pikkit community consensus'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pikkit-consensus-json
          path: data/*.json
          if-no-files-found: warn
